name: Composure
on:
  push:
    paths: ['apps/composure/**', '.github/workflows/composure.yml']
  pull_request:
    paths: ['apps/composure/**', '.github/workflows/composure.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/composure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/composure/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: composure-browser-results
          path: apps/composure/test-results
          retention-days: 7
