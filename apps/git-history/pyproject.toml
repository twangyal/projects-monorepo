[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-git-history"
version = "0.5.0"
description = "Read-only, evidence-linked reports for committed source history"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
javascript = [
    "tree-sitter==0.25.2",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
]

[project.scripts]
git-history = "git_history.cli:main"

[tool.setuptools.packages.find]
include = ["git_history*"]

[tool.setuptools.package-data]
git_history = ["web/*.html", "web/*.js", "web/*.css"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
