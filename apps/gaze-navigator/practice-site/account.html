<body>
  <header>
    <a class="brand" href="index.html">Northwind Books</a>
    <nav aria-label="Main"><ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="catalog.html">Catalog</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="account.html">Account</a></li>

    <form class="search" action="search.html" method="get" role="search">

      <li>The Quiet River <button data-practice="The Quiet River removed from saved books (practice).">Remove</button></li>

    <p><button data-practice="Practice sign-out. You are still here.">Sign out</button></p>
    <p><button class="danger" data-practice="Practice account deletion. Nothing was deleted.">Delete account</button></p>
  </main>
  <footer>A fictional practice website. Nothing is sold, sent or stored.</footer>
