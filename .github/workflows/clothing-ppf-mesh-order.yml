name: Clothing pinned mesh-order diagnostic
on:
  workflow_dispatch:
  push:
    branches: [autonomous/clothing-ppf-mesh-order-290]
    paths:
      - '.github/workflows/clothing-ppf-mesh-order.yml'
      - 'docs/research/ppf-cpu/patches/**'
permissions:
  contents: read
concurrency:
  group: ppf-mesh-order-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/upstream/target/cpu
      CARGO_TERM_COLOR: never
      RAYON_NUM_THREADS: '1'
      REPORT: ${{ github.workspace }}/mesh-order-report
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: st-tech/ppf-contact-solver
          ref: 6b30976f86e6b94d68d459e5237d59704c7d1384
          path: upstream
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record pinned source and append test-only instrumentation
        run: |
          set -euo pipefail
          mkdir -p "$REPORT"
          git -C upstream rev-parse HEAD > "$REPORT/upstream-revision.txt"
          git -C upstream status --porcelain > "$REPORT/upstream-original-status.txt"
          [ ! -s "$REPORT/upstream-original-status.txt" ]
          [ "$(cat "$REPORT/upstream-revision.txt")" = 6b30976f86e6b94d68d459e5237d59704c7d1384 ]
          { date -u +%FT%TZ; uname -srmo; nproc; rustc -vV; cargo -V; python --version; } > "$REPORT/environment.txt"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          source=Path('upstream/crates/ppf-cts-solver/src/mesh.rs');tests=Path('docs/research/ppf-cpu/patches/mesh_order_regression.rs')
          before=source.read_bytes();extra=tests.read_bytes()
          assert hashlib.sha256(before).hexdigest()=="17361cfee9af9f686b9c929fc59db4ec014412fccd3409a51b0298c1daef490f"
          source.write_bytes(before+extra)
          report=Path(os.environ['REPORT']);(report/'mesh_order_regression.rs').write_bytes(extra)
          (report/'source.json').write_text(json.dumps({'base_mesh_sha256':hashlib.sha256(before).hexdigest(),'test_sha256':hashlib.sha256(extra).hexdigest(),'instrumented_mesh_sha256':hashlib.sha256(before+extra).hexdigest(),'production_algorithm_changed':False},indent=2))
          PY
          git -C upstream diff --check
          git -C upstream diff > "$REPORT/test-only.diff"
      - name: Execute actual pinned mesh routines and require the expected RED assertions
        working-directory: upstream
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -v -o "$REPORT/test-resources.txt" cargo test -p ppf-cts-solver --bin ppf-contact-solver --locked --release --features cpu garment_order_regression -- --nocapture 2>&1 | tee "$REPORT/cargo-test.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$REPORT/test-exit-code.txt"
          [ "${statuses[1]}" -eq 0 ]
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(os.environ['REPORT']);log=(root/'cargo-test.log').read_text();code=int((root/'test-exit-code.txt').read_text())
          assert code==101,'Expected assertion failures, not success or process/setup failure.'
          for name in ['canonical_edges_and_neighbors','canonical_hinges_and_neighbors']:
              assert re.search(r'garment_order_regression::'+name+r' \.\.\. FAILED',log),'Missing intended RED test: '+name
          assert 'test result: FAILED. 1 passed; 2 failed;' in log,'Unexpected test result; do not accept compilation/setup errors.'
          (root/'receipt.json').write_text(json.dumps({'status':'expected_original_ordering_assertions_failed','upstream_revision':'6b30976f86e6b94d68d459e5237d59704c7d1384','test_exit_code':code,'passed':1,'failed':2,'log_sha256':hashlib.sha256((root/'cargo-test.log').read_bytes()).hexdigest(),'scope':'Actual pinned mesh routines with test-only instrumentation. No sorting fix, native trajectory or physical-fit result.'},indent=2))
          PY
      - name: Retain complete diagnostic after success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppf-original-mesh-order-${{ github.sha }}
          path: mesh-order-report/
          if-no-files-found: error
          retention-days: 14
