name: Duet

on:
  push:
    paths:
      - 'apps/duet/**'
      - '.github/workflows/duet.yml'
  pull_request:
    paths:
      - 'apps/duet/**'
      - '.github/workflows/duet.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/duet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/duet/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/duet/requirements-dev.txt
      - name: Install local media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - name: Python domain, HTTP, and real media tests
        run: python -m unittest discover -s tests -v
      - run: python -m compileall -q duet tests
      - run: ruff check .
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Production Chromium with real normalization and native audio
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: duet-browser-results
          path: apps/duet/test-results
          retention-days: 7
