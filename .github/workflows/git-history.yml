name: Git History

on:
  push:
    paths:
      - 'apps/git-history/**'
      - '.github/workflows/git-history.yml'
  pull_request:
    paths:
      - 'apps/git-history/**'
      - '.github/workflows/git-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: apps/git-history
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -v
      - run: python -m compileall -q git_history tests
      - run: ruff check .
      - run: python -m pip install .
      - run: git-history --help
