name: Friendly Challenges

on:
  push:
    paths:
      - 'apps/friendly-challenges/**'
      - '.github/workflows/friendly-challenges.yml'
  pull_request:
    paths:
      - 'apps/friendly-challenges/**'
      - '.github/workflows/friendly-challenges.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/friendly-challenges
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/friendly-challenges/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/friendly-challenges/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Agreement, authorization, HTTP and restart verification
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m compileall -q challenges tests
      - run: ruff check .
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Independent participants and arbiter in production Chromium
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: friendly-challenges-browser-results
          path: apps/friendly-challenges/test-results
          retention-days: 7
