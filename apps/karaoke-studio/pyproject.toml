[project]
name = "local-karaoke-studio"
version = "0.2.0"
description = "Local AI stem separation, lyric timing and karaoke song export"
requires-python = ">=3.11,<3.12"
dependencies = ["Pillow==11.3.0"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
