name: Git History

on:
  push:
    paths:
      - 'apps/git-history/**'
      - '.github/workflows/git-history.yml'
  pull_request:
    paths:
      - 'apps/git-history/**'
      - '.github/workflows/git-history.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: apps/git-history
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify dependency-free Python and manual-range behavior
        run: python -m unittest discover -v
      - run: python -m compileall -q git_history tests
      - run: ruff check .
      - name: Build and install the optional parser extra
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          wheels=(dist/local_git_history-*.whl)
          python -m pip install "${wheels[0]}[javascript]"
      - name: Verify the complete suite with native parsing required
        env:
          GIT_HISTORY_REQUIRE_JAVASCRIPT: '1'
        run: python -m unittest discover -v
      - name: Check installed command and isolated parser outside the source tree
        run: |
          cd "$RUNNER_TEMP"
          git-history --help
          python -I -c "from git_history.function_parser import parse_functions; result = parse_functions('export const square = (n: number) => n * n;', 'sample.ts'); assert [(f.qualified_name, f.start_line, f.end_line) for f in result] == [('square', 1, 1)]"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/git-history
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/git-history/package-lock.json
      - run: python -m pip install '.[javascript]'
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - name: Verify the local workbench against real Git repositories
        run: npm run test:browser
