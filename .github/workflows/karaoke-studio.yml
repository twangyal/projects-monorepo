name: Karaoke Studio

on:
  push:
    paths:
      - 'apps/karaoke-studio/**'
      - '.github/workflows/karaoke-studio.yml'
  pull_request:
    paths:
      - 'apps/karaoke-studio/**'
      - '.github/workflows/karaoke-studio.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/karaoke-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/karaoke-studio/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            apps/karaoke-studio/requirements-core.txt
            apps/karaoke-studio/requirements-dev.txt
      - name: Install local video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install core test dependencies only
        run: python -m pip install -r requirements-core.txt -r requirements-dev.txt
      - name: Python unit, HTTP, and real video tests
        run: python -m unittest discover -s tests -v
      - run: python -m compileall -q karaoke scripts tests
      - run: ruff check .
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Production browser workflow with fake separator and real video export
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: karaoke-studio-browser-results
          path: apps/karaoke-studio/test-results
          retention-days: 7
