name: Lens Studio

on:
  push:
    paths:
      - 'apps/lens-studio/**'
      - '.github/workflows/lens-studio.yml'
  pull_request:
    paths:
      - 'apps/lens-studio/**'
      - '.github/workflows/lens-studio.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/lens-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/lens-studio/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Production browser, projection oracle, storage and lossless PNG exports
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lens-studio-browser-results
          path: apps/lens-studio/test-results
          retention-days: 7
