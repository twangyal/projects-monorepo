<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catalog — Northwind Books</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./site.css" />
</head>
<body>
  <header>
    <a class="brand" href="index.html">Northwind Books</a>
    <nav aria-label="Main"><ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="catalog.html">Catalog</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="account.html">Account</a></li>
      <li><a href="help.html">Help</a></li>
    </ul></nav>
    <form class="search" action="search.html" method="get" role="search">
      <input type="search" name="q" aria-label="Search books" placeholder="Search books" />
      <button>Search</button>
    </form>
    <span>Cart: <span id="cartCount">0</span></span>
  </header>
  <main>
    <h1>Catalog</h1>
    <p class="notice" role="status"></p>
    <label class="field">Sort by
      <select id="sort"><option>Newest</option><option>Title</option><option>Price, low to high</option><option>Price, high to low</option></select>
    </label>
    <div class="cards">
      <article class="card"><h3>The Quiet River</h3><p>$14</p><button class="add-to-cart" data-title="The Quiet River">Add to cart</button> <a href="book.html">Details</a></article>
      <article class="card"><h3>Mountain Letters</h3><p>$18</p><button class="add-to-cart" data-title="Mountain Letters">Add to cart</button> <a href="book.html">Details</a></article>
      <article class="card"><h3>Gardens of Stone</h3><p>$12</p><button class="add-to-cart" data-title="Gardens of Stone">Add to cart</button> <a href="book.html">Details</a></article>
    </div>
  </main>
  <footer>A fictional practice website. Nothing is sold, sent or stored.</footer>
  <script type="module" src="./site.js"></script>
  <script type="module" src="./tasks.js"></script>
  <script type="module" src="../src/web/boot.js"></script>
</body>
</html>
