name: Gaze Navigator checks

on:
  push:
    paths: ['apps/gaze-navigator/**', '.github/workflows/gaze-navigator.yml']
  pull_request:
    paths: ['apps/gaze-navigator/**', '.github/workflows/gaze-navigator.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaze-navigator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (shard ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/gaze-navigator
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/3
      # Results stay in job logs. No persistent artifacts or caches are uploaded.
