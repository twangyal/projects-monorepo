name: Clothing actual-garment native preflight
on:
  push:
    paths:
      - 'apps/clothing-studio/src/product.ts'
      - 'apps/clothing-studio/src/media.ts'
      - 'apps/clothing-studio/src/garment-drape.ts'
      - 'apps/clothing-studio/src/native-garment-snapshot.ts'
      - 'apps/clothing-studio/scripts/export-native-garment.ts'
      - 'apps/clothing-studio/package-lock.json'
      - 'docs/research/ppf-cpu/garment*'
      - 'docs/research/ppf-cpu/test_garment*'
      - 'docs/research/ppf-cpu/results/garment*'
      - '.github/workflows/clothing-ppf-garment.yml'
  pull_request:
    paths:
      - 'apps/clothing-studio/**'
      - 'docs/research/ppf-cpu/garment*'
      - 'docs/research/ppf-cpu/test_garment*'
      - 'docs/research/ppf-cpu/results/garment*'
      - '.github/workflows/clothing-ppf-garment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/clothing-studio/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix apps/clothing-studio
      - name: Reproduce the entire actual garment packet
        run: |
          set -euo pipefail
          node --version
          node --experimental-strip-types apps/clothing-studio/scripts/export-native-garment.ts "$RUNNER_TEMP/garment-reproduced.json.gz"
          python - <<'PY'
          import gzip, os
          from pathlib import Path
          retained = Path('docs/research/ppf-cpu/results/garment-first.json.gz')
          actual = Path(os.environ['RUNNER_TEMP']) / 'garment-reproduced.json.gz'
          assert gzip.decompress(retained.read_bytes()) == gzip.decompress(actual.read_bytes()), 'Actual garment packet changed: review and regenerate the fixed capture, not just its summary.'
          PY
      - name: Check actual source provenance and independent geometry report
        run: |
          python docs/research/ppf-cpu/garment_admission.py docs/research/ppf-cpu/results/garment-first.json.gz --app apps/clothing-studio > "$RUNNER_TEMP/garment-admission.json"
          python - <<'PYREPORT'
          import json, os
          from pathlib import Path
          retained = json.loads(Path('docs/research/ppf-cpu/results/garment-first-admission.json').read_text())
          actual = json.loads((Path(os.environ['RUNNER_TEMP']) / 'garment-admission.json').read_text())
          assert actual == retained, 'Retained admission report drifted from the actual packet.'
          print(json.dumps(actual, indent=2))
          PYREPORT
          python -m unittest discover -s docs/research/ppf-cpu -p 'test_garment*.py'
      - name: Reproduce the reviewed cut-rib rest candidate
        run: |
          set -euo pipefail
          python docs/research/ppf-cpu/garment_rest_adapter.py docs/research/ppf-cpu/results/garment-first.json.gz "$RUNNER_TEMP/garment-rest-reproduced.json.gz"
          python - <<'PY'
          import gzip, hashlib, json, os
          from pathlib import Path
          raw = Path('docs/research/ppf-cpu/results/garment-rest-candidate.json.gz').read_bytes()
          retained = json.loads(gzip.decompress(raw))
          actual = json.loads(gzip.decompress((Path(os.environ['RUNNER_TEMP']) / 'garment-rest-reproduced.json.gz').read_bytes()))
          assert actual == retained, 'Retained rest candidate differs from actual complete mapping.'
          summary = {'bytes':len(raw), 'sha256':hashlib.sha256(raw).hexdigest(), 'vertices':len(retained['initial_positions_m']), 'faces':len(retained['faces']), 'sew_pairs':len(retained['sew_pairs']), 'maximum_structural_rest_error_m':retained['maximum_structural_rest_error_m'], 'status':retained['status']}
          assert summary == json.loads(Path('docs/research/ppf-cpu/results/garment-rest-candidate-summary.json').read_text()), 'Retained candidate summary drift.'
          PY
      - name: Reproduce the reviewed faceted body candidate
        run: |
          set -euo pipefail
          python docs/research/ppf-cpu/garment_body_mesh.py docs/research/ppf-cpu/results/garment-first.json.gz "$RUNNER_TEMP/garment-body-reproduced.json.gz"
          python - <<'PY'
          import gzip, hashlib, json, os
          from pathlib import Path
          raw = Path('docs/research/ppf-cpu/results/garment-body-candidate.json.gz').read_bytes()
          retained = json.loads(gzip.decompress(raw))
          actual = json.loads(gzip.decompress((Path(os.environ['RUNNER_TEMP']) / 'garment-body-reproduced.json.gz').read_bytes()))
          assert actual == retained, 'Retained complete body candidate differs from actual mesher.'
          summary = {'bytes':len(raw), 'sha256':hashlib.sha256(raw).hexdigest(), 'vertices':len(retained['vertices_m']), 'triangles':len(retained['triangles']), 'signed_volume_m3':retained['signed_volume_m3'], 'maximum_vertex_field_residual_m':retained['maximum_vertex_field_residual_m'], 'status':retained['status']}
          assert summary == json.loads(Path('docs/research/ppf-cpu/results/garment-body-candidate-summary.json').read_text()), 'Retained body summary drift.'
          PY
