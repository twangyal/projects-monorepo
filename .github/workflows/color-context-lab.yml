name: Color Context Lab

on:
  push:
    paths:
      - 'apps/color-context-lab/**'
      - '.github/workflows/color-context-lab.yml'
  pull_request:
    paths:
      - 'apps/color-context-lab/**'
      - '.github/workflows/color-context-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/color-context-lab
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/color-context-lab/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/color-context-lab/experiments/requirements.txt
      - run: npm ci
      - run: python -m pip install -r experiments/requirements.txt
      - name: Pure experiment and unrelated tiny learner checks
        run: python -m unittest discover -s experiments/tests -v
      - name: Independent frozen manifest, pixels and published results (no protocol fitting)
        run: >-
          python experiments/oracle/check_experiment.py
          --manifest experiments/frozen/manifest.json --producer-api --tiny-learner
          --results public/experiment-report.json
          --receipt experiments/frozen/receipt.json --allow-authorized-results
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Native PNG, complete project, recovery and worker lifecycle
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: color-context-lab-browser-results
          path: apps/color-context-lab/test-results
          retention-days: 7
