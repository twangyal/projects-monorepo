<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Northwind Books</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./site.css" />
</head>
<body>
  <header>
    <a class="brand" href="index.html">Northwind Books</a>
    <nav aria-label="Main"><ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="catalog.html">Catalog</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="account.html">Account</a></li>
      <li><a href="help.html">Help</a></li>
    </ul></nav>
    <form class="search" action="search.html" method="get" role="search">
      <input type="search" name="q" aria-label="Search books" placeholder="Search books" />
      <button>Search</button>
    </form>
    <span>Cart: <span id="cartCount">0</span></span>
  </header>
  <main>
    <h1>Contact us</h1>
    <p class="notice" role="status"></p>
    <form data-practice="Practice message sent. Nothing left this page.">
      <div class="field"><label for="name">Your name</label><input id="name" name="name" autocomplete="off" /></div>
      <div class="field"><label for="email">Email address</label><input id="email" type="email" name="email" autocomplete="off" /></div>
      <div class="field"><label for="topic">Topic</label>
        <select id="topic"><option>General question</option><option>Order problem</option><option>Book suggestion</option></select></div>
      <div class="field"><label for="message">Message</label><textarea id="message" rows="5"></textarea></div>
      <label><input type="checkbox" id="copy" /> Send me a copy</label>
      <p><button class="primary">Send message</button></p>
    </form>
  </main>
  <footer>A fictional practice website. Nothing is sold, sent or stored.</footer>
  <script type="module" src="./site.js"></script>
  <script type="module" src="./tasks.js"></script>
  <script type="module" src="../src/web/boot.js"></script>
</body>
</html>
